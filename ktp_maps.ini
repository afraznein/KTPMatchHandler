; The file the fleet loads is <configsdir>/ktp_maps.ini on each game host, and it
; is owned by afraznein/KTPDoDServerConfig at
;   serverfiles/dod/addons/ktpamx/configs/ktp_maps.ini
; Edit it THERE. Editing this copy changes nothing on any server; it exists so
; tests/config_parse/test_ktp_maps_ini.py validates the shape this plugin parses.
;
; Body below is the owner's content as of 2026-09-15. This copy is not kept in
; lockstep and will drift again -- treat the owner as the source, never this file.
;
; ==========================================
; KTP Match Handler - Map Configuration
; ==========================================
